<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagem</title>
</head>
<style>
    img {
        width: 200px;
        height: 200px;
    }
    main {
        text-align: center;
    }
    section {
        background-color: rgb(32, 185, 173);
        width: 300px;
        height: 80%;
        border: 2px solid black;
    }
</style>
<body>
    <main class="container">
        <section class="card">
            <img src="https://jpimg.com.br/uploads/2023/04/conheca-a-historia-do-gremio-no-brasileirao.jpg">
            <h1>Grêmio</h1>
            <p class="descricao">O mais forte de todos</p>
            <div class="habilidades">
            <h2>Habilidades</h2>
            <ul>
                <li>Imortal</li>
                <li>Resistência</li>
            </ul>
            </div>
            <div class="caracteristicas">
            <h2>Características</h2>
            <p><strong>Titulos:</strong> 60</p>
            <p><strong>Libertas:</strong> 3</p>
            </div>
        </section>
    </main>
</body>
</html>
